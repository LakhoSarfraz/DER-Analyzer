name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: bash
        run: |
          # Dynamically find the template folder and add it with PyInstaller 6.0 colon separator
          TEMPLATE_PATH=$(python -c "import docx, os; print(os.path.join(os.path.dirname(docx.__file__), 'templates'))")
          pyinstaller --noconfirm --onefile --windowed --name DER_Analyzer --add-data "${TEMPLATE_PATH}:docx/templates" main.py
            
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DER_Analyzer-exe
          path: dist/DER_Analyzer.exe
